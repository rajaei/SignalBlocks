global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'signalblocks'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NATS metrics
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'

  # Redis metrics (via redis-exporter would be needed, or basic monitoring)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Minio metrics
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # SignalBlocks App metrics (discovered via labels)
  - job_name: 'signalblocks-app'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['app:9091']
        labels:
          service: 'signalblocks'
          component: 'main'

  # Service discovery for Prometheus-labeled containers
  - job_name: 'docker'
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: instance
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
