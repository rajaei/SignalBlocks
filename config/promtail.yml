server:
  http_listen_port: 3101
  log_level: info

positions:
  filename: /tmp/promtail_positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    tenant_id: ""

scrape_configs:
  # Docker containers via Docker socket
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: signalblocks
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_service_name']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  # JSON file driver logs (systemd)
  - job_name: journal
    journal:
      path: /var/log/journal
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'unit'
      - source_labels: ['__journal_syslog_hostname']
        target_label: 'hostname'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'

  # SignalBlocks App logs
  - job_name: signalblocks
    static_configs:
      - targets: [localhost]
        labels:
          job: signalblocks
          service: app
          component: main
